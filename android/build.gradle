// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Cordova's plugin shim drags in kotlin-stdlib-jdk7/jdk8 1.6.21 while the
    // Capacitor plugins compile against kotlin-stdlib 1.8+. Since Kotlin 1.8
    // the jdk7/jdk8 artifacts were folded into kotlin-stdlib itself, so having
    // both on the classpath duplicates every class in them and
    // checkDebugAndroidTestDuplicateClasses fails. Pinning one stdlib and
    // dropping the merged-away artifacts resolves it.
    configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        }
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
