apply plugin: 'com.android.application'

// Release signing is read from android/keystore.properties, which is gitignored
// so the upload key never enters the repository. Without that file the release
// build still configures — it just produces an unsigned artefact, which is what
// a CI machine or a fresh clone should get. See docs/DEPLOY.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.nutripilots.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nutripilots.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // On since 1.6. Capacitor discovers plugins by reflection, which is
            // why this was held back — but capacitor-android ships consumer
            // ProGuard rules that keep every Plugin subclass and @PluginMethod,
            // and this module's only Java is an empty MainActivity. The rules
            // in proguard-rules.pro cover the rest. Play asks for it: an
            // obfuscated build uploads a mapping file so crashes stay readable,
            // and the shrink takes weight out of the APK.
            //
            // Resource shrinking stays off: the splash screen plugin resolves
            // drawables by name at runtime, which the shrinker cannot see.
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Play asks for native debug symbols so an NDK crash reads as a
            // stack trace rather than an address. The only native code here is
            // CameraX's two .so files, and Google ships those already stripped:
            //   "Unable to extract native debug metadata ... because the native
            //    debug metadata has already been stripped"
            // so the bundle carries none and that Play warning cannot be
            // cleared from this side. This stays on regardless — it costs
            // nothing, and any future dependency that ships unstripped
            // libraries gets its symbols packaged without anyone remembering.
            ndk {
                debugSymbolLevel 'FULL'
            }
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Netlify's SPA routing files and the forms probe are web-host concerns.
    // They are dead weight inside an APK, so they are not packaged.
    androidResources {
        ignoreAssetsPattern '!_headers:!_redirects:!__forms.html'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
