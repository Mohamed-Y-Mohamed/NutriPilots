<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071F18" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriPilot" />
    <meta
      name="description"
      content="NutriPilot — calorie tracking, food nutrition, recipes and AI meal analysis."
    />
    <!--
      Browsers disagree about which of these they honour, so the set is
      deliberately redundant. favicon.ico is requested by path by Windows and
      older browsers whether or not it is declared, so it must exist.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>NutriPilot</title>
    <style>
      /* Paints the splash colour before any CSS or JS loads, so a cold start
         never flashes white on the way to the React splash. */
      html { background: #071f18; }
      #root:empty { min-height: 100vh; background: #071f18; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
